<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কুইজ গেম – সহজে জাপানি শিখুন</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="text-slate-800 relative font-bengali" data-page="quiz">
    <div class="sakura-container" id="sakuraContainer"></div>
    <div class="relative z-10 flex flex-col min-h-screen" id="pageWrap">
        <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
<section id="tab-quiz" class="space-y-6">
                <div class="glass-card p-5 sm:p-6 rounded-2xl border border-sakura-200 flex justify-between items-center gap-3">
                    <div>
                        <h2 class="text-xl sm:text-2xl font-bold text-slate-800">ইন্টারেক্টিভ কুইজ গেম (Japanese Quiz)</h2>
                        <p class="text-slate-600 text-sm mt-1">আপনার জাপানি ভাষার দক্ষতা যাচাই করুন!</p>
                    </div>
                    <div class="text-right flex-shrink-0">
                        <span class="text-xs text-slate-500 font-medium">বর্তমান স্কোর</span>
                        <div class="text-2xl font-extrabold text-sakura-600" id="quizScore">0</div>
                    </div>
                </div>
                <div id="quizContainer" class="glass-card p-5 sm:p-8 rounded-2xl border border-sakura-200 space-y-6"></div>
            </section>
        </main>
    </div>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/quiz.js"></script>
</body>
</html>
