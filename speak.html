<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>দৈনন্দিন কথা – সহজে জাপানি শিখুন</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="text-slate-800 relative font-bengali" data-page="speak">
    <div class="sakura-container" id="sakuraContainer"></div>
    <div class="relative z-10 flex flex-col min-h-screen" id="pageWrap">
        <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
<section id="tab-speak" class="space-y-6">
                <div class="glass-card p-5 sm:p-6 rounded-2xl border border-sakura-200 space-y-3">
                    <h2 class="text-xl sm:text-2xl font-bold text-slate-800">🗣 দৈনন্দিন কথা (Daily Phrases)</h2>
                    <p class="text-slate-600 text-sm">🔊 শুনুন → 🎤 বলুন (Chrome-এ কাজ করে) → বাংলা অর্থ লুকিয়ে নিজেকে পরীক্ষা করুন।</p>
                    <div class="flex flex-wrap gap-2">
                        <button id="hideMeaningBtn" onclick="toggleHideMeaning()" class="px-4 py-2 rounded-xl bg-white border border-sakura-200 text-slate-700 hover:bg-sakura-50 text-sm font-semibold transition"><i class="fa-solid fa-eye-slash mr-1"></i> অর্থ লুকান</button>
                        <button onclick="startMiniQuiz()" class="px-4 py-2 rounded-xl bg-sakura-500 text-white hover:bg-sakura-600 text-sm font-semibold shadow transition"><i class="fa-solid fa-gamepad mr-1"></i> মিনি কুইজ</button>
                    </div>
                </div>
                <div class="flex overflow-x-auto gap-2 pb-1 scrollbar-none" id="phraseChips"></div>
                <div id="miniQuiz"></div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="phraseGrid"></div>
            </section>
        </main>
    </div>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/speak.js"></script>
</body>
</html>
